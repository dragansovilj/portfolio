<!DOCTYPE html>
<html lang="en" dir="ltr">

  <head>
    <meta charset="UTF-8">
    <title>Azurio - Temp Blocks</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="icon" href="../img/favicon/favicon.ico" sizes="any">
    <!-- Template Styles Start -->
    <link rel="stylesheet" type="text/css" href="../css/loader.css">
    <link rel="stylesheet" type="text/css" href="../css/plugins.css">
    <link rel="stylesheet" type="text/css" href="../css/main.css">
    <!-- Template Styles End -->
    <!-- Custom Browser Color Start -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEEAE8">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f">
    <meta name="msapplication-navbutton-color" content="#0f0f0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Custom Browser Color End -->
  </head>

  <body>

    <!-- Loader Start -->
    <!-- Loader End -->

    <!-- Menu & Menu Hamburger Start -->
    <!-- Menu & Menu Hamburger End -->

    <!-- Header Start -->
    <!-- Header End -->

    <!-- Page Content Start -->
    <main id="mxd-page-content" class="mxd-page-content">
      
      <!-- Section - Starter Section Start -->
      <div class="mxd-section">

        <div class="mxd-spacer bg-color-opposite">
          <h1>Just scroll, don't think</h1>
        </div>

        <div class="mxd-spacer bg-color-opposite">
          <img src="../img/gifs/forest.gif" alt="Forest" class="forest">
        </div>
        
      </div>
      <!-- Section - Starter Section End -->

      <!-- Section - Contact Form Start -->
      <div class="mxd-section">
        <div class="mxd-container grid-l-container">

          <!-- Block - Contact Form Start -->
          <div class="mxd-block">
            <div class="mxd-form-container">

              <!-- Reply Messages Start -->
              <div class="form__reply centered text-center">
                <i class="ph-fill ph-smiley-wink reply__icon"></i>
                <p class="reply__title">Done!</p>
                <span class="reply__text">Thanks for your message. We'll get back as soon as possible.</span>
              </div> 
              <!-- Reply Messages End -->
          
              <!-- Contact Form Start -->
              <form class="form contact-form" id="contact-form">
                <!-- Hidden Required Fields -->
                <input type="hidden" name="project_name" value="Rayo Template">
                <input type="hidden" name="admin_email" value="support@mixdesign.dev">
                <input type="hidden" name="form_subject" value="Contact Form Message">
                <!-- END Hidden Required Fields-->
                <div class="container-fluid p-0">
                  <div class="row gx-0">
                    <div class="col-12 col-md-6 mxd-grid-item anim-uni-in-up">
                      <input type="text" name="Name" placeholder="Your name*" required>
                    </div>
                    <div class="col-12 col-md-6 mxd-grid-item anim-uni-in-up">
                      <input type="text" name="Company" placeholder="Company name">
                    </div>
                    <div class="col-12 col-md-6 mxd-grid-item anim-uni-in-up">
                      <input type="email" name="E-mail" placeholder="Email*" required>
                    </div>
                    <div class="col-12 col-md-6 mxd-grid-item anim-uni-in-up">
                      <input type="tel" name="Phone" placeholder="Phone">
                    </div>
                    <div class="col-12 mxd-grid-item anim-uni-in-up">
                      <textarea name="Message" placeholder="A few words about your project*" required></textarea>
                    </div>
                    <div class="col-12 mxd-grid-item anim-uni-in-up">
                      <button  class="btn btn-default-icon btn-default-accent slide-right" type="submit">
                        <span class="btn-caption mxd-scramble">Submit</span>
                        <!-- <i class="btn-icon ph-bold ph-arrow-right"></i> -->
                        <i class="btn-icon">
                          <svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 18 18">
                            <path d="M10.8,0v3.6h-3.6V0h3.6ZM14.4,10.8h3.6v-3.6h-3.6v-3.6h-3.6v3.6H0v3.6h10.8v3.6h3.6v-3.6ZM10.8,14.4h-3.6v3.6h3.6v-3.6Z"/>
                          </svg>
                        </i>
                      </button>
                    </div>
                  </div>
                </div>
              </form>
              <!-- Contact Form End -->
          
            </div>
          </div>
          <!-- Block - Contact Form End -->

        </div>
      </div>
      <!-- Section - Contact Form End -->

      <!-- Section - Starter Section Start -->
      <div class="mxd-section">

        <div class="mxd-spacer bg-color-opposite">
          <h1>Just scroll, don't think</h1>
        </div>

        <div class="mxd-spacer bg-color-opposite">
          <img src="../img/gifs/forest.gif" alt="Forest" class="forest">
        </div>
        
      </div>
      <!-- Section - Starter Section End -->

    </main>
    <!-- Page Content End -->

    <!-- Footer Start -->
    <!-- Footer End -->

    <!-- To Top Button Start -->
    <!-- <a href="#0" id="to-top" class="btn btn-to-top slide-up anim-no-delay">
      <i class="ph ph-arrow-up"></i>
    </a> -->
    <!-- To Top Button End -->

    <div id="mxd-cursor" class="mxd-cursor">
      <div id="mxd-cursor__dot" class="mxd-cursor__dot"></div>
      <p id="mxd-cursor__text" class="mxd-cursor__text"></p>
      <div id="mxd-cursor__image" class="mxd-cursor__image"></div>
    </div>

    <!-- Load Scripts Start -->
    <script src="../js/libs.min.js"></script>
    <script src="../js/app.js"></script>
    <!-- Load Scripts End -->
    
  </body>

</html>
