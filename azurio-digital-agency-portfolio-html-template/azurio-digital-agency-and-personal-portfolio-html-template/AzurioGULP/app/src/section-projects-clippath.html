        <!-- Block - Projects ClipPath Showcase Start -->
        <div class="mxd-showcase-clip">

          <div>
            <div class="mxd-showcase-clip__trigger" role="listitem">
              <img class="mxd-showcase-clip__bg" src="../img/works/1920x1280_pr01.webp" alt="Image">

            </div>
          </div>
          <!-- items -->
          <div class="mxd-showcase-clip__track">
            <div class="mxd-showcase-clip__sticky" role="list">
              <a class="mxd-showcase-clip__item active-cursor-permanent" href="#0" role="listitem" data-cursor-text="View Work">

                <img class="mxd-showcase-clip__image" src="../img/works/700x700_pr01.webp" alt="Image">

                <img class="mxd-showcase-clip__image" src="../img/works/700x700_pr02.webp" alt="Image">
                <div class="mxd-showcase-clip__tags">
                  <span class="tag tag-m tag-permanent mxd-scramble">UI/UX</span>
